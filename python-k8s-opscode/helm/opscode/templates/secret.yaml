apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opscode.fullname" . }}-secrets
  namespace: {{ .Values.namespace.name | default "opscode" }}
  labels:
    {{- include "opscode.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
