apiVersion: v1
kind: Service
metadata:
  name: {{ include "opscode.fullname" . }}
  namespace: {{ .Values.namespace.name | default "opscode" }}
  labels:
    {{- include "opscode.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.config.prometheusPort | quote }}
    prometheus.io/path: {{ .Values.config.metricsPath | quote }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
  - name: metrics
    port: {{ .Values.service.metricsPort }}
    targetPort: metrics
    protocol: TCP
  selector:
    {{- include "opscode.selectorLabels" . | nindent 4 }}
