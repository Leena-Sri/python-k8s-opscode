apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opscode.fullname" . }}
  namespace: {{ .Values.namespace.name | default "opscode" }}
  labels:
    {{- include "opscode.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "opscode.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.config.prometheusPort | quote }}
        prometheus.io/path: {{ .Values.config.metricsPath | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "opscode.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "opscode.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.config.apiPort }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.config.prometheusPort }}
          protocol: TCP
        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: APP_NAME
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: APP_VERSION
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: ENVIRONMENT
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: API_PORT
        - name: KUBERNETES_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: KUBERNETES_TIMEOUT
        - name: KUBERNETES_RETRY_COUNT
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: KUBERNETES_RETRY_COUNT
        - name: REMEDIATION_ENABLED
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: REMEDIATION_ENABLED
        - name: REMEDIATION_DRY_RUN
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: REMEDIATION_DRY_RUN
        - name: REMEDIATION_MAX_RETRIES
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: REMEDIATION_MAX_RETRIES
        - name: REMEDIATION_COOLDOWN_SECONDS
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: REMEDIATION_COOLDOWN_SECONDS
        - name: REMEDIATION_ALLOWED_NAMESPACES
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: REMEDIATION_ALLOWED_NAMESPACES
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "opscode.fullname" . }}-secrets
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "opscode.fullname" . }}-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "opscode.fullname" . }}-secrets
              key: REDIS_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: LOG_LEVEL
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: LOG_FORMAT
        - name: PROMETHEUS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: {{ include "opscode.fullname" . }}-config
              key: PROMETHEUS_ENABLED
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
