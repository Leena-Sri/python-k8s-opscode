apiVersion: v1
kind: Secret
metadata:
  name: opscode-secrets
  namespace: opscode
  labels:
    app: opscode
type: Opaque
stringData:
  # Secret key for JWT and API authentication
  # IMPORTANT: Change this in production!
  SECRET_KEY: "change-this-secret-key-in-production-use-environment-variables"

  # Database connection string
  # Format: postgresql+asyncpg://user:password@host:port/database
  DATABASE_URL: "postgresql+asyncpg://opscode:opscode@postgres:5432/opscode"

  # Redis connection string
  # Format: redis://host:port/database
  REDIS_URL: "redis://redis:6379/0"

  # Optional: Cloud provider credentials
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  # AWS_REGION: "us-east-1"

  # GCP_PROJECT_ID: ""
  # GCP_CREDENTIALS_JSON: ""
  # GCP_REGION: "us-central1"
