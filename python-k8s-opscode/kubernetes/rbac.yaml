apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opscode
  namespace: opscode
  labels:
    app: opscode
rules:
  # Allow reading workloads
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "replicationcontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Allow restart and scale operations
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Allow reading pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Allow reading pod status
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opscode
  namespace: opscode
  labels:
    app: opscode
subjects:
  - kind: ServiceAccount
    name: opscode
    namespace: opscode
roleRef:
  kind: Role
  name: opscode
  apiGroup: rbac.authorization.k8s.io
