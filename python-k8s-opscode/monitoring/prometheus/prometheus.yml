global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'opscode-cluster'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Opscode application metrics
  - job_name: 'opscode'
    static_configs:
      - targets: ['opscode:9090']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # PostgreSQL exporter (optional)
  # - job_name: 'postgres'
